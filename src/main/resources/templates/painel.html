<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel da Oficina</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        section { margin-bottom: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        table, th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f4f4f4; }
        form { margin-top: 10px; }
        input, select, button { padding: 5px; margin: 2px; }
    </style>
</head>
<body>
<h1>Painel da Oficina Mecânica</h1>

<!-- Formulário para adicionar cliente -->
<section>
    <h2>Adicionar Cliente</h2>
    <form th:action="@{/clientes/adicionar}" method="post">
        <input type="text" name="nome" placeholder="Nome" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="telefone" placeholder="Telefone">
        <button type="submit">Adicionar Cliente</button>
    </form>
</section>

<!-- Clientes -->
<section>
    <h2>Clientes</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.id}"></td>
            <td th:text="${cliente.nome}"></td>
            <td th:text="${cliente.email}"></td>
        </tr>
        </tbody>
    </table>
</section>

<!-- Formulário para adicionar veículo -->
<section>
    <h2>Adicionar Veículo</h2>
    <form th:action="@{/veiculos/adicionar}" method="post">
        <input type="text" name="marca" placeholder="Marca" required>
        <input type="text" name="modelo" placeholder="Modelo" required>
        <input type="text" name="placa" placeholder="Placa" required>
        <select name="clienteId" required>
            <option value="" disabled selected>Selecionar Cliente</option>
            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
        </select>
        <button type="submit">Adicionar Veículo</button>
    </form>
</section>

<!-- Veículos -->
<section>
    <h2>Veículos</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Placa</th>
            <th>Modelo</th>
            <th>Dono</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="veiculo : ${veiculos}">
            <td th:text="${veiculo.id}"></td>
            <td th:text="${veiculo.placa}"></td>
            <td th:text="${veiculo.modelo}"></td>
            <td th:text="${veiculo.cliente.nome}"></td>
        </tr>
        </tbody>
    </table>
</section>

</body>
</html>
