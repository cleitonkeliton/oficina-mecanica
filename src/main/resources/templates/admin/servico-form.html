<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${servico.id == null} ? 'Novo serviço' : 'Editar serviço')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: equipe('servicos')}"></th:block>
<main class="app-conteudo">
    <div class="container container-estreito">
        <a class="voltar" th:href="@{/admin/servicos}">&larr; Serviços e preços</a>
        <div class="pagina-titulo">
            <h1 th:text="${servico.id == null} ? 'Novo serviço' : 'Editar serviço'">Serviço</h1>
        </div>

        <div class="card">
            <form class="form" th:action="@{/admin/servicos}" th:object="${servico}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'campo-erro'">
                    <label for="nome">Nome do serviço</label>
                    <input type="text" id="nome" th:field="*{nome}" maxlength="100" required autofocus>
                    <span class="erro-campo" th:errors="*{nome}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('descricao')} ? 'campo-erro'">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" maxlength="500" rows="3"
                              placeholder="O que está incluso no serviço"></textarea>
                    <span class="erro-campo" th:errors="*{descricao}"></span>
                </div>
                <div class="form-linha">
                    <div class="campo" th:classappend="${#fields.hasErrors('preco')} ? 'campo-erro'">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" th:field="*{preco}" min="0" step="0.01" required placeholder="0,00">
                        <span class="erro-campo" th:errors="*{preco}"></span>
                    </div>
                    <div class="campo" th:classappend="${#fields.hasErrors('tempoEstimado')} ? 'campo-erro'">
                        <label for="tempoEstimado">Tempo estimado</label>
                        <input type="text" id="tempoEstimado" th:field="*{tempoEstimado}" maxlength="50" placeholder="Ex.: 1 hora">
                        <span class="erro-campo" th:errors="*{tempoEstimado}"></span>
                    </div>
                </div>
                <label class="check">
                    <input type="checkbox" th:field="*{precoAPartirDe}">
                    <span>Mostrar como "a partir de" <span class="muted pequeno">(o valor final depende da avaliação)</span></span>
                </label>
                <label class="check">
                    <input type="checkbox" th:field="*{ativo}">
                    <span>Visível no site</span>
                </label>
                <div class="form-acoes">
                    <button class="btn" type="submit">Salvar serviço</button>
                    <a class="btn btn-secundario" th:href="@{/admin/servicos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
