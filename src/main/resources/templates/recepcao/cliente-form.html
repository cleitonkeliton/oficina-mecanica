<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${clienteForm.id == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: equipe('clientes')}"></th:block>
<main class="app-conteudo">
    <div class="container container-estreito">
        <a class="voltar" th:if="${clienteForm.id != null}" th:href="@{/recepcao/clientes/{id}(id=${clienteForm.id})}">&larr; Voltar ao cliente</a>
        <a class="voltar" th:if="${clienteForm.id == null}" th:href="@{/recepcao/clientes}">&larr; Clientes</a>
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="pagina-titulo">
            <div>
                <h1 th:text="${clienteForm.id == null} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
                <p th:if="${voltar == 'veiculo'}">Depois de salvar, você segue para o cadastro do veículo.</p>
            </div>
        </div>

        <div class="card">
            <form class="form" th:action="@{/recepcao/clientes}" th:object="${clienteForm}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="voltar" th:if="${voltar}" th:value="${voltar}">
                <input type="hidden" name="placa" th:if="${placa}" th:value="${placa}">

                <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'campo-erro'">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" th:field="*{nome}" maxlength="120" required autofocus>
                    <span class="erro-campo" th:errors="*{nome}"></span>
                </div>
                <div class="form-linha">
                    <div class="campo" th:classappend="${#fields.hasErrors('cpf')} ? 'campo-erro'">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" th:field="*{cpf}" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
                        <span class="erro-campo" th:errors="*{cpf}"></span>
                    </div>
                    <div class="campo" th:classappend="${#fields.hasErrors('telefone')} ? 'campo-erro'">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel" id="telefone" th:field="*{telefone}" maxlength="30" placeholder="(00) 00000-0000">
                        <span class="erro-campo" th:errors="*{telefone}"></span>
                    </div>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'campo-erro'">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" maxlength="120">
                    <span class="erro-campo" th:errors="*{email}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('senhaAcesso')} ? 'campo-erro'">
                    <label for="senhaAcesso"
                           th:text="${clienteForm.id != null and temAcesso} ? 'Nova senha de acesso ao site (opcional)' : 'Senha de acesso ao site (opcional)'">Senha</label>
                    <div class="busca">
                        <input type="password" id="senhaAcesso" th:field="*{senhaAcesso}" maxlength="60" autocomplete="new-password">
                        <button class="btn btn-secundario" type="button" data-gerar-senha="senhaAcesso">Gerar senha</button>
                    </div>
                    <span class="ajuda" th:if="${clienteForm.id != null and temAcesso}">O cliente já tem acesso. Deixe em branco para manter a senha atual.</span>
                    <span class="ajuda" th:unless="${clienteForm.id != null and temAcesso}">Com uma senha (mínimo 6 caracteres), o cliente entra em "Acompanhar meu carro" usando o CPF. Anote e passe para ele.</span>
                    <span class="erro-campo" th:errors="*{senhaAcesso}"></span>
                </div>

                <div class="form-acoes">
                    <button class="btn" type="submit" th:text="${voltar == 'veiculo'} ? 'Salvar e cadastrar veículo' : 'Salvar cliente'">Salvar</button>
                    <a class="btn btn-secundario" th:href="@{/recepcao/clientes}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
