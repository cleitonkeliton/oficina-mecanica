spring.application.name=oficina-mecanica

# Config do banco de dados (MySQL)
# Os valores depois de ":" são o padrão; para trocar sem mexer no arquivo,
# defina as variáveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/oficina_mecanica?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:usuario_oficina}
spring.datasource.password=${DB_PASSWORD:Qweasd@32}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Config JPA / Hibernate (as tabelas são criadas/atualizadas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Config do servidor
server.port=${PORT:8080}
server.servlet.session.timeout=60m
server.error.include-stacktrace=never

# Idioma e formatação (datas, valores em R$)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.messages.encoding=UTF-8

# Fuso horário das datas e horas: America/Sao_Paulo (troque com a variável de ambiente OFICINA_FUSO)

# Usuários criados automaticamente no primeiro start (troque as senhas depois de entrar)
oficina.seed.admin.login=admin
oficina.seed.admin.senha=${ADMIN_SENHA:admin123}
oficina.seed.recepcao.login=recepcao
oficina.seed.recepcao.senha=${RECEPCAO_SENHA:recepcao123}
